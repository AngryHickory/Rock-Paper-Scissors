<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
  </head>
  <body>
    <div id="title">Rock, Paper, Scissors?</div>


    <div id="buttons">
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
      <button id="refresh">New Game</button>
    </div>

    <div id="scoreContainer">
      <div id="humanChoice"></div>
      <div id="computerChoice"></div>
      <div id="roundResult"></div>
      <div id="score"></div>
      <div id="finalScore"></div>
      <div id="refreshMessage"></div>

      <div id="imgContainer">
        <img src="https://static.vecteezy.com/system/resources/previews/000/693/099/non_2x/rock-paper-scissors-rules-vector-illustration.jpg" alt="Rock Paper Scissors rules displayed as hands">
      </div>
    </div>

    

  </body>
</html>
